# Local development (hot reload). The VPS uses docker-compose.prod.yml via ./deploy.sh.
name: alibe

services:
  postgres:
    image: postgres:16-alpine
    container_name: alibe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alibe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alibe}
      POSTGRES_DB: alibe
    # Bound to 127.0.0.1 so the database is never reachable from the internet
    # (Docker-published ports bypass ufw). Use `docker compose exec postgres psql`.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - alibe-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alibe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: alibe-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://alibe:${POSTGRES_PASSWORD:-alibe}@postgres:5432/alibe
      PORT: 4000
      # No demo sellers/listings unless SEED_DEMO=true in .env.
      SEED_DEMO: ${SEED_DEMO:-false}
      # Leave empty in development: codes then appear in the app and the backend log.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Alibe <no-reply@alibe.mv>}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - alibe-uploads:/app/uploads
      - alibe-private:/app/private

  mobile:
    build: ./mobile
    container_name: alibe-mobile
    restart: unless-stopped
    # LAN_IP is the address phones/browsers use to reach this machine:
    # your Mac's LAN IP locally, or the VPS's public IP when hosted (see README).
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${LAN_IP:-localhost}
      EXPO_PUBLIC_API_BASE_URL: http://${LAN_IP:-localhost}:4000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      - backend
    volumes:
      - ./mobile:/app
      - mobile-node-modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  alibe-pg-data:
  alibe-uploads:
  alibe-private:
  mobile-node-modules:
