services:
  postgres:
    image: postgres:16-alpine
    container_name: alibe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alibe
      POSTGRES_PASSWORD: alibe
      POSTGRES_DB: alibe
    ports:
      - "5432:5432"
    volumes:
      - alibe-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alibe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: alibe-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://alibe:alibe@postgres:5432/alibe
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

  mobile:
    build: ./mobile
    container_name: alibe-mobile
    restart: unless-stopped
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${LAN_IP:-localhost}
      EXPO_PUBLIC_API_BASE_URL: http://${LAN_IP:-localhost}:4000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      - backend
    volumes:
      - ./mobile:/app
      - mobile-node-modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  alibe-pg-data:
  mobile-node-modules:
