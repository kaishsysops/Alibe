# The app's web server and the load balancer in front of the API.

# Sign-in code requests per visitor IP, counted here because this is the one
# place all traffic passes (each backend replica only sees its share).
# 3 a minute with a burst of 20: generous for carrier NAT, useless for abuse.
limit_req_zone $binary_remote_addr zone=codes:1m rate=3r/m;

# Docker's DNS, re-asked every 5s: replicas come and go during deploys.
resolver 127.0.0.11 valid=5s ipv6=off;

# Every backend replica. `resolve` keeps the list current as Docker adds and
# removes them; a replica that fails 3 times in a row is skipped for 3 seconds.
upstream api {
  zone api 64k;
  server backend:4000 resolve max_fails=3 fail_timeout=3s;
  keepalive 32;
  # Shorter than the backend's own keep-alive (65s), so nginx always closes
  # first and never reuses a connection the backend has just dropped.
  keepalive_timeout 30s;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Shared by both API locations below.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # A replica that's gone (mid-deploy) or refuses: try the next one.
  proxy_next_upstream error timeout http_502;
  # A just-removed replica doesn't refuse, it just never answers: give up on
  # connecting after 1s and move on, instead of the 60s default.
  proxy_connect_timeout 1s;
  proxy_next_upstream_tries 3;
  proxy_read_timeout 60s;
  client_max_body_size 60m;
  # Room for a whole Home feed in memory (no temp files on disk).
  proxy_buffers 32 16k;

  location ~ ^/api/auth/(otp|email)/request$ {
    limit_req zone=codes burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @toomany;
    error_page 502 503 504 = @updating;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api;
  }

  # The API lives under /api on the same address as the app (one public port,
  # no CORS). /api/listings -> a backend replica's /listings.
  location /api/ {
    # No replica answering at all (they're all restarting): answer for them,
    # so the app shows its "Alibe is updating" screen instead of an error.
    error_page 502 503 504 = @updating;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api;
  }

  location @updating {
    default_type application/json;
    add_header Retry-After 20 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"Alibe is updating. Back in a minute.","code":"MAINTENANCE"}';
  }

  location @toomany {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"error":"Too many code requests from your network. Please wait a minute and try again."}';
  }

  # Bundles have content hashes in their names: cache them for a year.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Every app route (/admin/sellers, /listing/...) is the same single page.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
