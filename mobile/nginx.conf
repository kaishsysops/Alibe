# The app's web server and the load balancer in front of the API.

# Sign-in code requests per visitor IP, counted here because this is the one
# place all traffic passes (each backend replica only sees its share).
# 3 a minute with a burst of 20: generous for carrier NAT, useless for abuse.
limit_req_zone $binary_remote_addr zone=codes:1m rate=3r/m;

# Link-preview bots and search engines: they can't run the app's JavaScript,
# so listing links are answered with a small page of title/price/photo tags
# (backend/src/routes/share.ts). People always get the app.
map $http_user_agent $alibe_bot {
  default 0;
  ~*(facebookexternalhit|facebot|whatsapp|twitterbot|telegrambot|viber|slackbot|discordbot|linkedinbot|pinterest|skypeuripreview|embedly|redditbot|googlebot|bingbot|duckduckbot|yandex|applebot|baiduspider) 1;
}

# https when the server's nginx in front says so (it terminates HTTPS).
map $http_x_forwarded_proto $alibe_scheme {
  default $scheme;
  https https;
}

# admin.alibe.online and portal.alibe.online serve the same app (it switches
# to the staff console by hostname) but stay out of search engines.
map $host $alibe_staff_site {
  default 0;
  ~^(admin|portal)\. 1;
}
map $host $alibe_robots {
  default "all";
  ~^(admin|portal)\. "noindex, nofollow";
}
# Old in-app admin links (alibe.online/admin/...) now live on admin.<domain>.
# Only for real domain names, so localhost and IP addresses are left alone.
map $host $alibe_admin_url {
  default "";
  "~^(?:www\.|beta\.)?(?<root>[a-z0-9-]+\.[a-z]{2,})$" "https://admin.$root/";
}

# Search engines and link-preview bots get a server-made page (with real text,
# links and structured data) for these; people always get the app.
map "$alibe_bot:$uri" $alibe_share {
  default "";
  "1:/" /__share/home;
  "~^1:/categories/(?<cat>[A-Za-z0-9_-]+)$" /__share/category/$cat;
  "~^1:/store/(?<store>[A-Za-z0-9_-]+)$" /__share/store/$store;
  "~^1:/seller/(?<who>[A-Za-z0-9_-]+)$" /__share/seller/$who;
}

# Docker's DNS, re-asked every 5s: replicas come and go during deploys.
resolver 127.0.0.11 valid=5s ipv6=off;

# Every backend replica. `resolve` keeps the list current as Docker adds and
# removes them; a replica that fails 3 times in a row is skipped for 3 seconds.
upstream api {
  zone api 64k;
  server backend:4000 resolve max_fails=3 fail_timeout=3s;
  keepalive 32;
  # Shorter than the backend's own keep-alive (65s), so nginx always closes
  # first and never reuses a connection the backend has just dropped.
  keepalive_timeout 30s;
}

server {
  listen 80;

  # Behind Caddy (HTTPS) the visitor's IP arrives in X-Real-IP. Trusted only
  # from Docker's own networks, i.e. from Caddy.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Real-IP;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Shared by both API locations below.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # A replica that's gone (mid-deploy) or refuses: try the next one.
  proxy_next_upstream error timeout http_502;
  # A just-removed replica doesn't refuse, it just never answers: give up on
  # connecting after 1s and move on, instead of the 60s default.
  proxy_connect_timeout 1s;
  proxy_next_upstream_tries 3;
  proxy_read_timeout 60s;
  client_max_body_size 60m;
  # Room for a whole Home feed in memory (no temp files on disk).
  proxy_buffers 32 16k;

  location ~ ^/api/auth/(otp|email)/request$ {
    limit_req zone=codes burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @toomany;
    error_page 502 503 504 = @updating;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api;
  }

  # The API lives under /api on the same address as the app (one public port,
  # no CORS). /api/listings -> a backend replica's /listings.
  location /api/ {
    # No replica answering at all (they're all restarting): answer for them,
    # so the app shows its "Alibe is updating" screen instead of an error.
    error_page 502 503 504 = @updating;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api;
  }

  location @updating {
    default_type application/json;
    add_header Retry-After 20 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"Alibe is updating. Back in a minute.","code":"MAINTENANCE"}';
  }

  location @toomany {
    default_type application/json;
    add_header Retry-After 60 always;
    return 429 '{"error":"Too many code requests from your network. Please wait a minute and try again."}';
  }

  # A shared listing link: bots get the preview page, people get the app.
  location ~ ^/listing/([A-Za-z0-9_-]+)$ {
    if ($alibe_bot) {
      rewrite ^/listing/(.*)$ /__share/listing/$1 last;
    }
    add_header Cache-Control "no-cache";
    # Description, preview image and "Add to Home Screen" tags on the app's page.
    sub_filter_once on;
    sub_filter '<title>Alibe</title>' '<title>Alibe Maldives: Buy and Sell Online | Phones, Cars, Furniture</title>';
    sub_filter '</head>' '<meta name="description" content="Alibe is the Maldives marketplace: buy and sell phones, cars, furniture, boats, fashion and more, from Mal&eacute; and Hulhumal&eacute; to Addu. Free to list."><meta property="og:site_name" content="Alibe"><meta property="og:title" content="Alibe Maldives: buy and sell online"><meta property="og:description" content="Phones, furniture, vehicles and more, from Mal&eacute; to Addu."><meta property="og:image" content="$alibe_scheme://$host/api/brand/icon-512.png"><meta name="theme-color" content="#FF6A00"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/api/brand/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Alibe"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Alibe","alternateName":["Alibe Maldives","alibe.online"],"url":"$alibe_scheme://$host/","potentialAction":{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"$alibe_scheme://$host/search?q={search_term_string}"},"query-input":"required name=search_term_string"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Alibe","alternateName":"Alibe Maldives","url":"$alibe_scheme://$host/","logo":"$alibe_scheme://$host/api/brand/icon-512.png"}</script></head>';
    try_files /index.html =404;
  }

  # The preview page itself (its own tags, so none are added here).
  location /__share/ {
    internal;
    rewrite ^/__share/(.*)$ /share/$1 break;
    proxy_pass http://api;
  }

  location = /sitemap.xml {
    rewrite ^ /share/sitemap.xml break;
    proxy_pass http://api;
  }

  location = /robots.txt {
    default_type text/plain;
    if ($alibe_staff_site) {
      return 200 "User-agent: *\nDisallow: /\n";
    }
    # The app loads its data from /api/, so search engines need to read the
    # public parts (listings, photos, categories, stores) to see the pages.
    return 200 "User-agent: *\nAllow: /\nDisallow: /api/auth/\nDisallow: /api/admin/\nDisallow: /api/staff/\nDisallow: /api/conversations/\nDisallow: /api/orders/\nDisallow: /api/purchases/\nDisallow: /api/notifications/\nDisallow: /api/favorites/\nDisallow: /api/sellers/\nDisallow: /api/ids/\nDisallow: /api/slips/\nDisallow: /api/blocks/\nDisallow: /admin/\nDisallow: /chat/\nDisallow: /order/\nDisallow: /purchases\nDisallow: /seller-account\nDisallow: /register-store\nDisallow: /verify\nSitemap: $alibe_scheme://$host/sitemap.xml\n";
  }

  # "Add to Home Screen": the app opens full screen with its own icon.
  location = /manifest.json {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400";
    return 200 '{"name":"Alibe","short_name":"Alibe","description":"Buy and sell across the Maldives","start_url":"/","scope":"/","display":"standalone","background_color":"#FF6A00","theme_color":"#FF6A00","icons":[{"src":"/api/brand/icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"/api/brand/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}';
  }

  # Bundles have content hashes in their names: cache them for a year.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ^~ /admin/ {
    if ($alibe_admin_url) {
      return 301 $alibe_admin_url;
    }
    try_files /index.html =404;
  }

  # Every app route (/search, /seller/..., /store/...) is the same single page.
  location / {
    if ($alibe_share) {
      rewrite ^ $alibe_share last;
    }
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag $alibe_robots;
    # Description, preview image and "Add to Home Screen" tags on the app's page.
    sub_filter_once on;
    sub_filter '<title>Alibe</title>' '<title>Alibe Maldives: Buy and Sell Online | Phones, Cars, Furniture</title>';
    sub_filter '</head>' '<meta name="description" content="Alibe is the Maldives marketplace: buy and sell phones, cars, furniture, boats, fashion and more, from Mal&eacute; and Hulhumal&eacute; to Addu. Free to list."><meta property="og:site_name" content="Alibe"><meta property="og:title" content="Alibe Maldives: buy and sell online"><meta property="og:description" content="Phones, furniture, vehicles and more, from Mal&eacute; to Addu."><meta property="og:image" content="$alibe_scheme://$host/api/brand/icon-512.png"><meta name="theme-color" content="#FF6A00"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/api/brand/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Alibe"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Alibe","alternateName":["Alibe Maldives","alibe.online"],"url":"$alibe_scheme://$host/","potentialAction":{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"$alibe_scheme://$host/search?q={search_term_string}"},"query-input":"required name=search_term_string"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Alibe","alternateName":"Alibe Maldives","url":"$alibe_scheme://$host/","logo":"$alibe_scheme://$host/api/brand/icon-512.png"}</script></head>';
    try_files $uri $uri/ /index.html;
  }

}
