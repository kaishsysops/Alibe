server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker's DNS, re-asked every 10s: the backend gets a new address each time
  # it's recreated, and nginx must still start while the backend is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The API lives under /api on the same address as the app (one public port,
  # no CORS). /api/listings -> backend:4000/listings.
  location /api/ {
    set $backend http://backend:4000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m;
    proxy_read_timeout 60s;
    # Backend down (a deploy is restarting it): answer for it, so the app
    # shows its "Alibe is updating" screen instead of an error.
    error_page 502 504 = @updating;
  }

  location @updating {
    default_type application/json;
    add_header Retry-After 20 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"Alibe is updating. Back in a minute.","code":"MAINTENANCE"}';
  }

  # Bundles have content hashes in their names: cache them for a year.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Every app route (/admin/sellers, /listing/...) is the same single page.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
